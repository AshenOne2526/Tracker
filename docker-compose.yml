services:
    pgsql:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: '${DB_DATABASE:-tracker}'
            POSTGRES_USER: '${DB_USERNAME:-tracker}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-tracker}'
        ports:
            - '${DB_PORT:-5432}:5432'
        volumes:
            - pgsql-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME:-tracker}']
            interval: 10s
            timeout: 5s
            retries: 5

    meilisearch:
        image: getmeili/meilisearch:v1.13
        environment:
            MEILI_MASTER_KEY: '${MEILISEARCH_KEY:-masterKey}'
            MEILI_NO_ANALYTICS: 'true'
        ports:
            - '7700:7700'
        volumes:
            - meilisearch-data:/meili_data
        healthcheck:
            test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:7700/health']
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    pgsql-data:
    meilisearch-data:
